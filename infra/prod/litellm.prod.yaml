# LiteLLM configuration for the IP-only production demo.
model_list:
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 1000
      timeout: 15

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4000
      timeout: 30

  - model_name: mistral-7b
    litellm_params:
      model: ollama/mistral
      api_base: os.environ/OLLAMA_BASE_URL
      max_tokens: 1000
      timeout: 30

  - model_name: nomic-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_BASE_URL

  - model_name: jml-parse
    litellm_params:
      model: ollama/mistral
      api_base: os.environ/OLLAMA_BASE_URL
      max_tokens: 600
      timeout: 25
    model_info:
      mode: chat
    fallbacks: ["claude-sonnet"]

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  retry_after: 5
  allowed_fails: 2
  cooldown_time: 30
  timeout: 90
  redis_host: redis
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  drop_params: true
  set_verbose: false
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    ttl: 300
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  disable_spend_logs: false
  ui_access_mode: "all"
