# ─────────────────────────────────────────────────────────────
# JML Ops · Production Stack · docker-compose.prod.yml
# Target: DigitalOcean Droplet (4 vCPU / 16GB, region fra1 for EU data residency)
# Usage:  docker compose -f infra/prod/docker-compose.prod.yml up -d
# Secrets: via .env.prod (never commit) or Docker Secrets
# ─────────────────────────────────────────────────────────────
name: jmlops-prod

services:

  # ── Nginx reverse proxy + TLS ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: jmlops-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
      - ./www:/var/www/vantra-zero-site:ro
    depends_on:
      - api
      - web
    networks:
      - jmlops-prod

  # ── Certbot (TLS cert automation) ────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: jmlops-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - jmlops-prod

  # ── Postgres (pgvector) ───────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jmlops-postgres-prod
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - jmlops-prod

  # ── Redis (BullMQ backend) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jmlops-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory-policy noeviction
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - jmlops-prod

  # ── LiteLLM proxy ─────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: jmlops-litellm-prod
    restart: always
    environment:
      DATABASE_URL:         ${DATABASE_URL}
      LITELLM_MASTER_KEY:   ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY:    ${ANTHROPIC_API_KEY}
      OLLAMA_BASE_URL:      ${OLLAMA_BASE_URL}
    volumes:
      - ./litellm.prod.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4002"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jmlops-prod

  # ── Fastify API ───────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: jmlops-api-prod
    restart: always
    expose:
      - "4000"
    environment:
      NODE_ENV:             production
      API_PORT:             "4000"
      DATABASE_URL:         ${DATABASE_URL}
      REDIS_PASSWORD:       ${REDIS_PASSWORD}
      REDIS_HOST:           redis
      JWT_SECRET:           ${JWT_SECRET}
      AUDIT_HMAC_SECRET:    ${AUDIT_HMAC_SECRET}
      WEBHOOK_SECRET:       ${WEBHOOK_SECRET}
      CORS_ORIGINS:         ${CORS_ORIGINS}
      API_ORIGIN:           ${API_ORIGIN}
      WEB_ORIGIN:           ${WEB_ORIGIN}
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID:     ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      LITELLM_URL:          http://litellm:4002
      LITELLM_MASTER_KEY:   ${LITELLM_MASTER_KEY}
      DEMO_MODE_ENABLED:    ${DEMO_MODE_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    healthcheck:
      test:     ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout:  5s
      retries:  3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    networks:
      - jmlops-prod

  # ── BullMQ Worker ─────────────────────────────────────────
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: jmlops-worker-prod
    restart: always
    environment:
      NODE_ENV:             production
      DATABASE_URL:         ${DATABASE_URL}
      REDIS_PASSWORD:       ${REDIS_PASSWORD}
      REDIS_HOST:           redis
      AUDIT_HMAC_SECRET:    ${AUDIT_HMAC_SECRET}
      LITELLM_URL:          http://litellm:4002
      LITELLM_MASTER_KEY:   ${LITELLM_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    networks:
      - jmlops-prod

  # ── Next.js Web ───────────────────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL:  ${NEXT_PUBLIC_WS_URL}
    container_name: jmlops-web-prod
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV:                production
      HOSTNAME:                "0.0.0.0"
      PORT:                    "3000"
      NEXT_PUBLIC_API_URL:     ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL:      ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_APP_NAME:    "JML Ops"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - api
    networks:
      - jmlops-prod
    healthcheck:
      test:     ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 20s
      timeout:  5s
      retries:  3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  pgdata_prod:
  redisdata_prod:
  certbot_www:

networks:
  jmlops-prod:
   name: jmlops-prod
