# ─────────────────────────────────────────────────────────────
# JML Ops · LiteLLM Proxy Config
# Port: 4002
# Routing: task type + data sensitivity header
# ─────────────────────────────────────────────────────────────

model_list:

  # ── CLOUD — Anthropic API ──────────────────────────────────

  - model_name: claude-haiku        # Slack bot, fast classify
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 1000
      timeout: 15

  - model_name: claude-sonnet       # JML intent parsing, reports
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4000
      timeout: 30

  - model_name: claude-opus         # Deep compliance analysis
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 8000
      timeout: 60

  # ── LOCAL — Ollama (on host, not in Docker) ────────────────

  - model_name: mistral-7b          # Fast classify, email gen
    litellm_params:
      model: ollama/mistral
      api_base: os.environ/OLLAMA_BASE_URL
      max_tokens: 1000
      timeout: 15

  - model_name: qwen-27b            # PII-sensitive parsing (GDPR)
    litellm_params:
      model: ollama/qwen2.5:27b
      api_base: os.environ/OLLAMA_BASE_URL
      max_tokens: 4000
      timeout: 60

  - model_name: deepseek-r1         # Root cause analysis
    litellm_params:
      model: ollama/deepseek-r1:14b
      api_base: os.environ/OLLAMA_BASE_URL
      max_tokens: 4000
      timeout: 90

  - model_name: nomic-embed         # RAG embeddings → pgvector
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_BASE_URL

  # ── FALLBACK ALIASES ────────────────────────────────────────
  # If Anthropic API is down → fall back to local Qwen
  - model_name: jml-parse
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      mode: chat
    fallbacks: ["qwen-27b"]

  - model_name: jml-classify
    litellm_params:
      model: ollama/mistral
      api_base: os.environ/OLLAMA_BASE_URL
    model_info:
      mode: chat
    fallbacks: ["claude-haiku"]

# ── Router settings ─────────────────────────────────────────
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  retry_after: 5
  allowed_fails: 2
  cooldown_time: 30
  timeout: 90
  redis_host: redis
  redis_port: 6379

# ── Server settings ─────────────────────────────────────────
litellm_settings:
  drop_params: true
  set_verbose: false
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 300          # 5-min cache for identical prompts
  success_callback: []
  failure_callback: []

# ── General settings ────────────────────────────────────────
general_settings:
  master_key:         os.environ/LITELLM_MASTER_KEY
  database_url:       os.environ/DATABASE_URL
  store_model_in_db:  false
  disable_spend_logs: false
  ui_access_mode:     "all"
